name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the annotated tag's message for the release notes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # mcp[cli] is a BUILD-time need, not a runtime one: --collect-all mcp
          # makes PyInstaller import every mcp submodule, and mcp.cli does
          # `sys.exit(1)` when typer is absent (typer ships only in the [cli]
          # extra). requirements.txt pins `mcp>=1.2`, so CI drifted onto 1.28.1
          # and the build broke with no code change — first seen 2026-07-27,
          # last green build was v2.30.3 on 2026-06-25.
          # requirements.txt pins mcp<2; the [cli] extra must not override it.
          pip install -r requirements.txt pyinstaller "mcp[cli]<2"

      - name: Generate icon
        run: python assets/make_icon.py

      - name: Build Pipevoice.exe
        run: >
          pyinstaller --noconfirm --clean --noconsole --onedir --noupx --name Pipevoice
          --icon assets/wisprlite.ico
          --add-data "assets/wisprlite.ico;assets"
          --add-data "assets/pipevoice-lockup.png;assets"
          --collect-all deepgram
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all pystray
          --collect-all PIL
          --collect-all mss
          --collect-all mcp
          --collect-all pydantic
          --collect-all anyio
          --collect-all pydantic_settings
          --collect-all jsonschema
          --collect-all sse_starlette
          --collect-all starlette
          --collect-all uvicorn
          --collect-all httpx
          launch.py

      # The build being green says nothing about the app running. v2.40.1
      # shipped a --mcp that died on `import pydantic_settings` the moment an
      # agent spawned it: PyInstaller cannot see FastMCP's module-level imports,
      # so it left them out and nothing noticed. Drive the BUILT exe and make it
      # answer, or the same class of miss ships again.
      - name: Smoke-test the built exe's MCP server
        shell: pwsh
        run: |
          $exe = "dist/Pipevoice/Pipevoice.exe"
          $req = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          $req | Set-Content mcp_in.txt -Encoding ascii
          $p = Start-Process $exe -ArgumentList '--mcp' -RedirectStandardInput mcp_in.txt `
                 -RedirectStandardOutput mcp_out.txt -RedirectStandardError mcp_err.txt `
                 -PassThru -WindowStyle Hidden
          Start-Sleep 25
          if (!$p.HasExited) { $p.Kill() }
          $out = Get-Content mcp_out.txt -Raw -ErrorAction SilentlyContinue
          $err = Get-Content mcp_err.txt -Raw -ErrorAction SilentlyContinue
          if ($err) { Write-Host "stderr:`n$err" }
          if ($out -match 'jsonrpc') {
            Write-Host "MCP server answered."
          } else {
            Write-Host "MCP server produced no JSON-RPC reply."
            Write-Host "stdout:`n$out"
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          # Version comes from the SOURCE, not from a literal in the .iss. That
          # literal was last updated at 2.25.0, so every installer since then
          # reported 2.25.0 in Add/Remove Programs whatever it actually was.
          $v = (Select-String -Path wisprlite/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not $v) { Write-Error "could not read __version__ from wisprlite/__init__.py"; exit 1 }
          Write-Host "Building installer for version $v"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\Pipevoice.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash installer/Output/Pipevoice-Setup.exe -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("installer/Output/Pipevoice-Setup.exe.sha256", $h)

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pipevoice-Setup
          path: installer/Output/Pipevoice-Setup.exe

      - name: Release notes from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: relnotes
        shell: bash
        run: |
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          {
            echo "body<<__PVEOF__"
            echo "$NOTES"
            echo "__PVEOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # ALWAYS a prerelease first. /releases/latest excludes prereleases, so
          # this is what keeps a new build away from stable installs. Publishing
          # normally and editing it afterwards leaves a window in which anyone
          # polling receives it — which defeats the ring entirely.
          # Promote deliberately:  gh release edit vX.Y.Z --prerelease=false --latest
          prerelease: true
          body: ${{ steps.relnotes.outputs.body }}
          files: |
            installer/Output/Pipevoice-Setup.exe
            installer/Output/Pipevoice-Setup.exe.sha256
          generate_release_notes: true
